version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for the routine bumps, individual ones for anything else, so
      # review effort goes where risk is.
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "pre-commit", "hypothesis"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
