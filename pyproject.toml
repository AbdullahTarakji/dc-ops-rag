[project]
name = "dcrag"
version = "0.1.0"
description = "Grounded question answering over datacenter facilities documentation: hybrid RAG, evaluated honestly, served through FastAPI."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Abdullah Tarakji" }]
keywords = ["rag", "retrieval-augmented-generation", "llm", "evaluation", "clean-architecture"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

# Optional groups are installed per iteration, so the default install stays small
# and CI (which runs on fakes only) never downloads a machine-learning stack.
[project.optional-dependencies]
ingest = ["pymupdf4llm>=0.0.17", "tiktoken>=0.8"]
retrieval = ["sentence-transformers>=3.3", "qdrant-client>=1.12", "rank-bm25>=0.2.2", "faiss-cpu>=1.9"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "sse-starlette>=2.1"]
agent = ["langgraph>=0.2.50", "langchain-ollama>=0.2", "xgboost>=2.1", "scikit-learn>=1.5", "shap>=0.46"]
eval = ["mlflow>=2.18", "numpy>=2.1", "pandas>=2.2", "scipy>=1.14"]
ui = ["gradio>=5.5"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.119",
  "mypy>=1.13",
  "ruff>=0.8",
  "pre-commit>=4.0",
]

[project.urls]
Repository = "https://github.com/AbdullahTarakji/dc-ops-rag"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcrag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # import sorting
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "C4",        # comprehensions
  "SIM",       # simplify
  "PTH",       # use pathlib
  "RET",       # return statements
  "ARG",       # unused arguments
  "TID",       # tidy imports
  "T20",       # no print in library code
  "ANN",       # type annotations required
  "S",         # bandit security rules
  "RUF",       # ruff-specific
  "D",         # docstrings
]
ignore = [
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "ANN401", # allow typing.Any where genuinely dynamic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D100", "D101", "D102", "D103", "ANN201", "ANN001"]
"scripts/**" = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

# Tests get full type checking except for the annotations pytest fixtures would force
# onto every signature; the value there is in the assertions, not in restating fixture types.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=src/dcrag --cov-report=term-missing --cov-fail-under=90"
markers = [
  "slow: tests that load real models or hit the network (excluded from CI)",
]

[tool.coverage.run]
branch = true
omit = ["src/dcrag/api/*", "src/dcrag/agent/*", "src/dcrag/eval/*"]
