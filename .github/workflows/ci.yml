name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running job irrelevant, so cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Reproducibility: the lockfile decides versions, never the resolver of the day.
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --python 3.11

      # Ordered cheapest-first so a formatting slip fails in seconds, not minutes.
      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Mypy
        run: uv run mypy

      # No GPU, no Docker, no network: the suite runs against in-memory fakes, which is
      # only possible because every dependency sits behind a port.
      - name: Pytest
        run: uv run pytest

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # All extras, not just what the test job installs: torch and mlflow ship in the
      # container even though CI never imports them.
      - name: Export the locked dependency set
        run: |
          uv export --no-hashes --all-extras --no-emit-project \
            --format requirements-txt > requirements-audit.txt
          # An empty export would make the audit pass vacuously, which is worse than a
          # failing audit because it looks green.
          test "$(grep -cv '^#' requirements-audit.txt)" -gt 50

      # PYSEC-2026-3552 is ignored deliberately and the reasoning is written down in
      # docs/security.md, along with the condition that ends the exception.
      - name: Audit for known vulnerabilities
        run: |
          uvx pip-audit --requirement requirements-audit.txt --strict \
            --ignore-vuln PYSEC-2026-3552
